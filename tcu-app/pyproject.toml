[project]
name = "tcu-inglesia"
version = "0.1.0"
description = "Proyecto TCU Inglesia"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi==0.116.1",
    "jinja2==3.1.6",
    "psycopg[binary]==3.2.9",
    "uvicorn[standard]==0.35.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mkdocs-material==9.6.18",
    "pytest==8.4.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]